name: Pipeline Recovery V1 CI

on:
  pull_request:
    paths:
      - 'patches/recover_dead_areas_v1.mjs'
      - 'install/APPLY_PIPELINE_RECOVERY_V1.ps1'
      - 'install/APPLY_PIPELINE_RECOVERY_V1.cmd'
      - '.github/workflows/pipeline-recovery-v1.yml'

jobs:
  node-patch-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check patches/recover_dead_areas_v1.mjs

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'install/APPLY_PIPELINE_RECOVERY_V1.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          cmd /c "call install\APPLY_PIPELINE_RECOVERY_V1.cmd < NUL" 2>$null
          if ($LASTEXITCODE -eq 9009) { exit 1 }
          exit 0
